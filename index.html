<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Obfuscator + Pastefy</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #e0e0e0; min-height: 100vh; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
h1 { font-size: 1.6rem; margin-bottom: 0.3rem; color: #a78bfa; text-align: center; }
p.sub { font-size: 0.85rem; color: #888; margin-bottom: 1.5rem; text-align: center; }
.wrap { width: 100%; max-width: 720px; }
.card { background: #1e293b; border: 1px solid #2e3f58; border-radius: 12px; padding: 1.4rem; margin-bottom: 1.2rem; }
.card h3 { font-size: 0.95rem; color: #a78bfa; margin-bottom: 1rem; letter-spacing: 0.04em; text-transform: uppercase; }
label { display: block; font-size: 0.78rem; color: #94a3b8; margin-bottom: 0.35rem; margin-top: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }
label:first-child { margin-top: 0; }
textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-family: 'Consolas', monospace; font-size: 0.85rem; padding: 0.75rem; resize: vertical; min-height: 150px; outline: none; transition: border-color 0.2s; }
textarea:focus { border-color: #7c3aed; }
input[type=text] { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-family: 'Consolas', monospace; font-size: 0.85rem; padding: 0.6rem 0.75rem; outline: none; transition: border-color 0.2s; }
input[type=text]:focus { border-color: #7c3aed; }
.row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.85rem; }
button { flex: 1; min-width: 130px; padding: 0.65rem 1rem; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-purple { background: #7c3aed; color: #fff; }
.btn-purple:hover:not(:disabled) { background: #6d28d9; }
.btn-blue { background: #2563eb; color: #fff; }
.btn-blue:hover:not(:disabled) { background: #1d4ed8; }
.btn-green { background: #059669; color: #fff; }
.btn-green:hover:not(:disabled) { background: #047857; }
.btn-gray { background: #1e3a5a; color: #cbd5e1; border: 1px solid #334155; }
.btn-gray:hover { background: #273f5c; }
.btn-teal { background: #0e7490; color: #fff; }
.btn-teal:hover:not(:disabled) { background: #0c6478; }
.status { font-size: 0.82rem; padding: 0.5rem 0.75rem; border-radius: 6px; margin-top: 0.75rem; display: none; }
.status.info { background: #1e3a5f; color: #93c5fd; display: block; }
.status.ok   { background: #064e3b; color: #6ee7b7; display: block; }
.status.err  { background: #450a0a; color: #fca5a5; display: block; }
.raw-box { display: none; margin-top: 0.75rem; }
.raw-url { background: #0f172a; border: 1px solid #7c3aed; border-radius: 8px; padding: 0.6rem 0.75rem; font-family: monospace; font-size: 0.8rem; color: #c4b5fd; word-break: break-all; }
.badge { display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; margin-left: 8px; background: #3b0764; color: #c4b5fd; vertical-align: middle; }
</style>
</head>
<body>
<div class="wrap">

<h1>⬡ Lua Obfuscator + Pastefy</h1>
<p class="sub">Ofusca tu código Lua, súbelo a Pastefy y genera tu loadstring</p>

<!-- GENERADOR DE CÓDIGO LUA (nuevo, arriba) -->
<div class="card">
  <h3>Generador de Código Lua</h3>
  <label>Segundo Link:</label>
  <input type="text" id="url2" placeholder="https://orrxl4-protector.com/api/raw?id=xxxxx">
  <div class="row">
    <button class="btn-blue" onclick="generar()">Generar Código</button>
  </div>
  <label>Resultado:</label>
  <textarea id="loadResult" readonly style="height:200px;"></textarea>
  <div class="row">
    <button class="btn-gray" onclick="copiarLoadstring()">📋 Copiar</button>
  </div>
</div>

<!-- OFUSCADOR -->
<div class="card">
  <h3>① Ofuscador Lua</h3>
  <label>Código Lua original</label>
  <textarea id="inputCode" placeholder="Pega aquí tu código Lua..."></textarea>
  <div class="row">
    <button class="btn-purple" onclick="ofuscar()">⚡ Ofuscar</button>
    <button class="btn-gray" onclick="copiarInput()">📋 Copiar original</button>
  </div>
</div>

<!-- OUTPUT + PASTEFY -->
<div class="card">
  <h3>② Código ofuscado <span class="badge" id="charCount"></span></h3>
  <label>Resultado</label>
  <textarea id="outputCode" placeholder="El código ofuscado aparecerá aquí, o pega tu código directamente..."></textarea>
  <div class="row">
    <button class="btn-gray" onclick="copiarOutput()">📋 Copiar</button>
    <button class="btn-green" id="btnSubir" onclick="subirPastefy()" disabled>🚀 Subir a Pastefy</button>
  </div>
  <div class="status" id="status"></div>
  <div class="raw-box" id="rawBox">
    <label>RAW link generado</label>
    <div class="raw-url" id="rawUrl"></div>
    <div class="row">
      <button class="btn-gray" onclick="copiarRaw()">📋 Copiar RAW URL</button>
      <button class="btn-teal" onclick="abrirRaw()">🔗 Abrir RAW</button>
    </div>
  </div>
</div>

<!-- FORMATO LOADER (el original que ya estaba) -->
<div class="card">
  <h3>③ Generador de formato loader</h3>
  <label>Pega el RAW link de Pastefy</label>
  <input type="text" id="rawInput" placeholder="https://pastefy.app/XXXXXXXX/raw" oninput="generarFormato()"/>
  <div style="margin-top:0.75rem;">
    <label>Plantilla personalizable</label>
    <input type="text" id="plantilla" value="loadstring(game:HttpGet('{URL}'))()" oninput="generarFormato()"/>
    <p style="font-size:0.75rem;color:#555;margin-top:0.3rem;">Usa <code style="color:#a78bfa;background:#1f1f2e;padding:1px 5px;border-radius:4px;">{URL}</code> donde va el link.</p>
  </div>
  <label>Resultado</label>
  <div id="formatoResult" style="background:#0f172a;border:1px solid #334155;border-radius:8px;padding:0.6rem 0.75rem;font-family:'Consolas',monospace;font-size:0.85rem;color:#6ee7b7;min-height:40px;word-break:break-all;margin-top:0.35rem;">
    <span style="color:#555">El formato aparecerá aquí...</span>
  </div>
  <div class="row">
    <button class="btn-gray" onclick="copiarFormato()">📋 Copiar formato</button>
    <button class="btn-green" onclick="usarRawGenerado()">⬆ Usar RAW generado arriba</button>
  </div>
</div>

</div>
<script>
let lastRawUrl = '';

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('outputCode').addEventListener('input', function() {
    document.getElementById('btnSubir').disabled = this.value.trim() === '';
  });
});

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function luaNumericEscape(str) {
  let r = '"';
  for (let i = 0; i < str.length; i++) {
    r += '\\' + String(str.charCodeAt(i)).padStart(3, '0');
  }
  return r + '"';
}

function basicObfuscate(code) {
  return code.replace(/(["'])((?:(?!\1)[^\\]|\\.)*)(\1)/g, (match, q, content) => {
    return luaNumericEscape(content);
  });
}

function ofuscar() {
  const code = document.getElementById('inputCode').value.trim();
  if (!code) { setStatus('⚠ Pega código Lua primero.', 'err'); return; }
  const result = basicObfuscate(code);
  document.getElementById('outputCode').value = result;
  document.getElementById('btnSubir').disabled = false;
  document.getElementById('charCount').textContent = result.length + ' chars';
  setStatus('✅ Ofuscación completada.', 'ok');
}

async function subirPastefy() {
  const code = document.getElementById('outputCode').value.trim();
  if (!code) return;
  document.getElementById('btnSubir').disabled = true;
  setStatus('⏳ Subiendo a Pastefy...', 'info');
  try {
    const res = await fetch('https://pastefy.app/api/v2/paste', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: code, title: 'Obfuscated Lua', type: 'PASTE', visibility: 'UNLISTED' })
    });
    const data = await res.json();
    if (data && data.paste && data.paste.id) {
      lastRawUrl = 'https://pastefy.app/' + data.paste.id + '/raw';
      document.getElementById('rawUrl').textContent = lastRawUrl;
      document.getElementById('rawBox').style.display = 'block';
      setStatus('✅ Subido a Pastefy exitosamente.', 'ok');
    } else { throw new Error('Respuesta inesperada de Pastefy'); }
  } catch(e) {
    setStatus('❌ Error: ' + e.message, 'err');
  }
  document.getElementById('btnSubir').disabled = false;
}

// Generador nuevo (arriba)
function generar() {
  const segundo = document.getElementById('url2').value.trim();
  const codigo =
`local function run(url)
    task.spawn(function()
        local ok, src = pcall(function()
            return game:HttpGet(url)
        end)
        if ok and src then
            local f, err = loadstring(src)
            if f then
                pcall(f)
            else
                warn(err)
            end
        else
            warn("No se pudo obtener: "..url)
        end
    end)
end
run("https://pastefy.app/EPHCMCIX/raw")
run("${segundo}")`;
  document.getElementById('loadResult').value = codigo;
}

function copiarLoadstring() {
  const v = document.getElementById('loadResult').value;
  if (v) { navigator.clipboard.writeText(v); alert('Código copiado.'); }
}

// Generador de formato loader (el original de abajo)
function generarFormato() {
  const url = document.getElementById('rawInput').value.trim();
  const plantilla = document.getElementById('plantilla').value;
  const resultado = document.getElementById('formatoResult');
  if (!url) { resultado.innerHTML = '<span style="color:#555">El formato aparecerá aquí...</span>'; return; }
  resultado.textContent = plantilla.replace('{URL}', url);
}

function copiarFormato() {
  const texto = document.getElementById('formatoResult').textContent;
  if (!texto || texto.includes('aparecerá')) { setStatus('⚠ No hay formato generado.', 'err'); return; }
  navigator.clipboard.writeText(texto);
  setStatus('📋 Formato copiado.', 'ok');
}

function usarRawGenerado() {
  if (!lastRawUrl) { setStatus('⚠ Primero sube a Pastefy para obtener el RAW.', 'err'); return; }
  document.getElementById('rawInput').value = lastRawUrl;
  generarFormato();
}

function copiarInput() {
  const v = document.getElementById('inputCode').value;
  if (v) navigator.clipboard.writeText(v);
}
function copiarOutput() {
  const v = document.getElementById('outputCode').value;
  if (v) { navigator.clipboard.writeText(v); setStatus('📋 Copiado.', 'ok'); }
}
function copiarRaw() {
  if (lastRawUrl) { navigator.clipboard.writeText(lastRawUrl); setStatus('📋 RAW copiado.', 'ok'); }
}
function abrirRaw() {
  if (lastRawUrl) window.open(lastRawUrl, '_blank');
}
</script>
</body>
</html>
